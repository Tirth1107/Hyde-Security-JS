<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HydeSecurityJS: Full Interactive Test Suite</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --card: #131a2b;
      --card-hover: #182236;
      --border: #1e2d45;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.15);
      --text: #dbe8f5;
      --muted: #7b8fa6;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #8b5cf6;
      --cyan: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    .header {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-left h1 {
      font-size: 22px;
      color: #fff;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-left h1 span {
      background: linear-gradient(135deg, var(--accent), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-left p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .status-pill {
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(34, 197, 94, 0.12);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.25);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-pill::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 14px;
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      border-color: rgba(59, 130, 246, 0.3);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.05);
    }

    .card-head {
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-head h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      flex: 1;
    }

    .badge {
      font-size: 9px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .badge-core {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent);
    }

    .badge-data {
      background: rgba(139, 92, 246, 0.15);
      color: var(--purple);
    }

    .badge-detect {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
    }

    .badge-auth {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
    }

    .badge-tamper {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    .badge-info {
      background: rgba(6, 182, 212, 0.15);
      color: var(--cyan);
    }

    .badge-privacy {
      background: rgba(168, 85, 247, 0.15);
      color: #a855f7;
    }

    /* Playground */
    .playground {
      padding: 14px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .desc {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }

    .demo-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px dashed var(--border);
      padding: 10px 12px;
      border-radius: 6px;
      position: relative;
    }

    .demo-label {
      position: absolute;
      top: -8px;
      left: 10px;
      background: var(--card);
      padding: 0 6px;
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Controls */
    input,
    textarea,
    select {
      width: 100%;
      background: #0d1420;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-family: 'Consolas', 'Fira Code', monospace;
      font-size: 12px;
      transition: border-color 0.2s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-danger {
      background: var(--danger);
    }

    .btn-success {
      background: var(--success);
    }

    .btn-warn {
      background: var(--warning);
      color: #000;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Log */
    .log {
      font-family: 'Consolas', monospace;
      font-size: 10px;
      color: var(--muted);
      margin-top: auto;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.15);
      max-height: 70px;
      overflow-y: auto;
      min-height: 32px;
    }

    .log-entry {
      margin-bottom: 3px;
      display: flex;
      gap: 6px;
    }

    .ts {
      color: var(--warning);
      opacity: 0.6;
      font-size: 9px;
    }

    /* Output / Preview */
    .code-out {
      color: #93a8c4;
      font-size: 11px;
      font-family: 'Consolas', monospace;
      word-break: break-all;
      padding: 6px 8px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 4px;
      min-height: 20px;
    }

    /* Password bar */
    .pwd-bar-track {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }

    .pwd-bar-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s, background 0.3s;
      border-radius: 2px;
    }

    .pwd-info {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
    }

    /* Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .toggle {
      width: 36px;
      height: 20px;
      background: var(--border);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .toggle.on {
      background: var(--accent);
    }

    .toggle::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.2s;
    }

    .toggle.on::after {
      transform: translateX(16px);
    }

    /* Toast Container */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: var(--card);
      border-left: 3px solid var(--accent);
      padding: 10px 16px;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 13px;
      animation: slideIn 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .toast.alert {
      border-color: var(--danger);
    }

    @keyframes slideIn {
      from {
        transform: translateX(120%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .secure-shield {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
      font-size: 11px;
    }

    .info-grid dt {
      color: var(--muted);
    }

    .info-grid dd {
      color: #fff;
      margin: 0;
      word-break: break-all;
    }

    @media (max-width: 500px) {
      .grid {
        grid-template-columns: 1fr;
      }

      body {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-left">
      <h1>🛡️ <span>HydeSecurityJS</span> Test Suite</h1>
      <p>Interactive playground — tests every module with the real library.</p>
    </div>
    <div class="header-actions">
      <div class="status-pill" id="status-pill">Library Loaded</div>
      <button class="btn-ghost" onclick="clearAllLogs()">Clear Logs</button>
    </div>
  </div>

  <div class="grid" id="dashboard"></div>
  <div class="toast-container" id="toasts"></div>

  <script type="module" src="./full-test.js"></script>
</body>

</html>
