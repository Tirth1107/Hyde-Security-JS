# Publishes to npm when a version tag (v1.2.3) is pushed.
# Uses npm trusted publishing (OIDC): no npm token and no OTP are stored anywhere.
# One-time setup on npmjs.com: package settings -> Trusted publishing -> GitHub Actions,
# repository Tirth1107/Hyde-Security-JS, workflow file publish.yml.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets npm verify this workflow instead of a token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" \
            || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version"; exit 1; }

      - run: npm run type-check
      - run: npm run lint
      - run: npx vitest run

      # prepublishOnly runs the build
      - run: npm publish --access public
